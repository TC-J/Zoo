[project]
name = "zoo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"platformdirs>=4.11.3",
	"rich>=15.0.0",
	"typer>=0.27.1",
	"zoo-dev"

]

[project.scripts]
zoo = "zoo:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
zoo-dev = { workspace = true }